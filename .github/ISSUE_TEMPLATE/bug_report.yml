name: Bug report
description: Something is wrong, missing, or attributed to the wrong thing.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The command you ran, or the thing that was running. If a process was missed or misattributed, the output of `strays inspect <pid>` helps a great deal (check it for anything private first).
  - type: input
    id: version
    attributes:
      label: Strays version
      description: Settings > About.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 15.5, Apple Silicon
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Ports and processes
        - AI agent attribution
        - Docker
        - Homebrew services
        - Stacks
        - Stopping things
        - The interface
        - Something else
