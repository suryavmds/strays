name: Agent profile
description: Add an AI coding agent, or verify the environment marker of one that is listed.
labels: [agent-profile]
body:
  - type: markdown
    attributes:
      value: |
        The quickest route is a pull request that changes only `agents.json`: see
        [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md#adding-or-verifying-an-agent).
        If you would rather report what you found, this form is enough for someone else to make that change.
  - type: input
    id: agent
    attributes:
      label: Agent and version
      placeholder: Codex CLI 0.48
    validations:
      required: true
  - type: textarea
    id: inspect
    attributes:
      label: Output of `strays inspect <pid>`
      description: For a background process started through the agent, using node, python, or another third-party runtime. Remove anything private.
      render: text
    validations:
      required: true
  - type: textarea
    id: orphan
    attributes:
      label: After the agent exited
      description: Run `strays inspect <pid>` again once the agent has quit. Was the marker still there? Was the parent PID 1?
      render: text
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
